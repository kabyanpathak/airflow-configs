name: Airflow CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: airflow-ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: cp .env.example .env
      - name: Admin — build, lint, compile, and launch Airflow
        run: bash tests/admin/check.sh
      - name: Full committed test suite
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        run: |
          docker compose run --rm --no-deps \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --entrypoint bash airflow -euc '
              pip install --no-cache-dir -r tests/requirements.txt
              python -m pytest -p no:cacheprovider tests/admin tests/Unit tests/Integration tests/E2E
            '
      - name: Airflow logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Clean up CI containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans
