name: Airflow CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: airflow-ci
      COMPOSE_FILE: compose.yaml:tests/Integration/compose.yaml
      FULL_SUITE: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install admin test dependencies
        run: python -m pip install -r tests/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Admin — lint Python, YAML, workflows, and Compose
        run: bash tests/admin/check.sh
      - name: Integration — build and launch Airflow
        id: integration
        if: env.FULL_SUITE == 'true'
        run: bash tests/Integration/check.sh
      - name: Committed Python tests in the Airflow image
        if: env.FULL_SUITE == 'true'
        run: |
          docker compose exec -T airflow python -m pip check
          docker compose run --rm --no-deps \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --entrypoint bash airflow -euc '
              pip install --no-cache-dir -r tests/requirements.txt
              python -m pytest -p no:cacheprovider tests/admin tests/Unit tests/Integration --ignore=tests/Integration/test_restart.py
            '
      - name: Integration — restart and database persistence
        if: env.FULL_SUITE == 'true'
        run: python -m pytest tests/Integration/test_restart.py
      - name: Install browser test dependencies
        if: env.FULL_SUITE == 'true'
        run: |
          python -m pip install -r tests/E2E/requirements.txt
          python -m playwright install --with-deps chromium
      - name: E2E — UI rendering and navigation
        if: env.FULL_SUITE == 'true'
        run: |
          export AIRFLOW_TEST_URL="http://$(docker compose port airflow 8080)"
          python -m pytest tests/E2E
      - name: Airflow logs on failure
        if: failure() && (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure')
        run: docker compose logs --no-color --tail=200
      - name: Clean up CI containers and data
        if: always() && (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure')
        run: docker compose down --volumes --remove-orphans
